<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏫 우리 반 앱 진열장</title>
    
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts: 귀엽고 가독성 좋은 '주아(Jua)' & '고운돋움(Gowun Dodum)' -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">

    <!-- Tailwind 커스텀 설정 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'jua': ['"Jua"', 'sans-serif'],
                        'dodum': ['"Gowun Dodum"', 'sans-serif'],
                    },
                    colors: {
                        'cream': '#FFFDF7',
                        'warm-yellow': '#FFF5D6',
                        'soft-mint': '#E0F7F4',
                        'mint-accent': '#4ECDC4',
                        'soft-pink': '#FFE5EC',
                        'pink-accent': '#FF6B6B',
                        'choco': '#4A403A',
                    }
                }
            }
        }
    </script>

    <style>
        /* 전체 기본 폰트 및 배경 설정 */
        body {
            font-family: 'Gowun Dodum', sans-serif;
            background-color: #FFFDF7;
            /* 아기자기한 도트 패턴 배경 */
            background-image: radial-gradient(#F2E8CF 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            color: #4A403A;
        }

        /* 제목용 둥글둥글한 폰트 */
        .font-title {
            font-family: 'Jua', sans-serif;
        }

        /* 카드 호버 및 터치 시 통통 튀어 오르는 애니메이션 */
        .app-card {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
        }
        .app-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 14px 24px -6px rgba(74, 64, 58, 0.12), 0 6px 10px -4px rgba(74, 64, 58, 0.06);
        }
        .app-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        /* 가로 스크롤바 숨기기 (모바일 카테고리 필터용) */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-soft-pink selection:text-choco">

    <!-- 상단 진열장 간판 (Header) -->
    <header class="pt-8 pb-6 px-4 text-center">
        <div class="max-w-4xl mx-auto">
            <!-- 귀여운 상단 뱃지 -->
            <div class="inline-flex items-center gap-2 bg-warm-yellow border-2 border-amber-200 px-4 py-1.5 rounded-full text-sm font-bold text-amber-800 shadow-sm mb-3">
                <span>✨ 오늘도 즐거운 우리 반 수업 시간 ✨</span>
            </div>
            
            <!-- 메인 타이틀 -->
            <h1 class="font-title text-4xl sm:text-5xl text-choco tracking-wide drop-shadow-sm mb-2">
                🎒 우리 반 앱 진열장
            </h1>
            <p class="text-base sm:text-lg text-stone-600 font-medium">
                필요한 수업 도구를 콕! 눌러서 새 창으로 열어보세요.
            </p>
        </div>
    </header>

    <!-- 메인 콘텐츠 영역 -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 pb-16">
        
        <!-- 검색창 & 과목 필터 컨트롤 박스 -->
        <section class="bg-white/90 backdrop-blur-sm border-2 border-stone-100 rounded-3xl p-4 sm:p-6 shadow-sm mb-8">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                
                <!-- 과목별 알약 필터 버튼 영역 -->
                <div id="category-filters" class="flex items-center gap-2 overflow-x-auto no-scrollbar w-full md:w-auto pb-1 md:pb-0">
                    <!-- 자바스크립트로 버튼이 자동 생성됩니다 -->
                </div>

                <!-- 앱 이름 검색창 -->
                <div class="relative w-full md:w-72">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-lg pointer-events-none">
                        🔍
                    </span>
                    <input 
                        type="text" 
                        id="search-input" 
                        placeholder="앱 이름이나 설명 검색..." 
                        class="w-full pl-10 pr-9 py-2.5 bg-cream border-2 border-stone-200 rounded-full text-sm sm:text-base focus:outline-none focus:border-mint-accent focus:ring-2 focus:ring-soft-mint transition-colors"
                    >
                    <!-- 검색어 지우기 버튼 -->
                    <button 
                        id="clear-search" 
                        class="hidden absolute inset-y-0 right-0 flex items-center pr-3 text-stone-400 hover:text-choco"
                        title="검색어 지우기"
                    >
                        ✖
                    </button>
                </div>

            </div>
        </section>

        <!-- 앱 카드 진열장 그리드 -->
        <section id="app-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 sm:gap-6">
            <!-- 자바스크립트로 앱 카드가 이곳에 자동 생성됩니다 -->
        </section>

        <!-- 검색 결과가 없을 때 보여줄 안내 메시지 -->
        <div id="empty-state" class="hidden text-center py-16 bg-white/70 rounded-3xl border-2 border-dashed border-stone-200">
            <div class="text-5xl mb-3">🧐</div>
            <h3 class="font-title text-2xl text-choco mb-1">앗, 찾는 앱이 진열장에 없어요!</h3>
            <p class="text-stone-500">다른 검색어로 찾아보거나 '전체' 버튼을 눌러보세요.</p>
        </div>

    </main>

    <!-- 하단 진열장 바닥 (Footer) -->
    <footer class="py-6 text-center text-sm text-stone-500 border-t border-stone-200/60 bg-white/50">
        <p class="font-medium">🏫 우리 반 스마트 교실 진열장 &bull; 카드를 누르면 새 탭에서 열려요!</p>
    </footer>

    <!-- =====================================================================
         [선생님 전용 설정 구역]
         아래 appList 배열에 한 줄씩 추가하거나 수정하면 화면에 자동으로 반영됩니다!
         ===================================================================== -->
    <script>
        /**
         * 📌 [앱 목록 관리]
         * - title: 카드에 크게 표시될 앱 이름
         * - desc: 앱에 대한 간단한 한 줄 설명
         * - icon: 앱을 대표하는 귀여운 이모지 (윈도우: Win + . / 맥: Ctrl + Cmd + Space)
         * - url: 클릭했을 때 열릴 웹페이지 주소 (https:// 로 시작하거나 같은 폴더 내 파일명)
         * - category: 과목 분류 ('국어', '수학', '과학', '사회', '놀이/기타' 등 자유롭게 작성 가능)
         */
        const appList = [
            { title: "동물 분류 탐정", desc: "여러 가지 동물의 생김새와 특징을 관찰하고 알맞게 분류해 보는 탐정 놀이!", icon: "🐾", url: "https://gemini.google.com/share/ef8ddfaf4dd1", category: "과학" },
            { title: "태양계 행성 탐험 도감", desc: "수성부터 해왕성까지 신비로운 태양계 행성들의 특징을 생생하게 살펴봐요.", icon: "🪐", url: "planets.html", category: "과학" },
            { title: "수업 이해도 신호등", desc: "오늘 배운 내용을 얼마나 이해했는지 신호등 색깔로 선생님께 알려줘요!", icon: "🚦", url: "https://goodteacher.my.canva.site/cn6yfa7tj1g84afr", category: "놀이/기타" }
        ];

        // =====================================================================
        // 아래부터는 화면을 자동으로 그려주는 프로그램 코드입니다. (수정하지 않으셔도 됩니다)
        // =====================================================================

        // 과목별 파스텔 색상 테마 매핑 (새 과목을 추가해도 기본 예쁜 색상이 자동 적용됨)
        const categoryColors = {
            '국어': { badge: 'bg-rose-100 text-rose-700 border-rose-200', iconBg: 'bg-rose-50', borderHover: 'hover:border-rose-300' },
            '수학': { badge: 'bg-sky-100 text-sky-700 border-sky-200', iconBg: 'bg-sky-50', borderHover: 'hover:border-sky-300' },
            '과학': { badge: 'bg-emerald-100 text-emerald-700 border-emerald-200', iconBg: 'bg-emerald-50', borderHover: 'hover:border-emerald-300' },
            '사회': { badge: 'bg-amber-100 text-amber-800 border-amber-200', iconBg: 'bg-amber-50', borderHover: 'hover:border-amber-300' },
            '놀이/기타': { badge: 'bg-purple-100 text-purple-700 border-purple-200', iconBg: 'bg-purple-50', borderHover: 'hover:border-purple-300' },
            'default': { badge: 'bg-teal-100 text-teal-700 border-teal-200', iconBg: 'bg-teal-50', borderHover: 'hover:border-teal-300' }
        };

        // 상태 변수
        let currentCategory = '전체';
        let currentSearchQuery = '';

        // DOM 요소 참조
        const categoryFiltersEl = document.getElementById('category-filters');
        const appGridEl = document.getElementById('app-grid');
        const searchInputEl = document.getElementById('search-input');
        const clearSearchBtn = document.getElementById('clear-search');
        const emptyStateEl = document.getElementById('empty-state');

        /**
         * appList에 등록된 과목들을 자동으로 추출해 상단 필터 버튼을 만듭니다.
         */
        function renderCategoryButtons() {
            // 중복 없는 과목 목록 추출 ('전체'를 맨 앞에 배치)
            const categories = ['전체', ...new Set(appList.map(app => app.category))];
            
            categoryFiltersEl.innerHTML = '';

            categories.forEach(category => {
                const isSelected = currentCategory === category;
                const button = document.createElement('button');
                
                button.textContent = category;
                button.className = `px-4 py-2 rounded-full text-sm sm:text-base font-bold whitespace-nowrap transition-all duration-200 cursor-pointer border-2 ${
                    isSelected 
                    ? 'bg-choco text-white border-choco shadow-sm scale-105' 
                    : 'bg-cream text-stone-600 border-stone-200 hover:bg-warm-yellow hover:border-amber-300'
                }`;

                button.addEventListener('click', () => {
                    currentCategory = category;
                    renderCategoryButtons();
                    renderAppCards();
                });

                categoryFiltersEl.appendChild(button);
            });
        }

        /**
         * 현재 선택된 과목과 검색어에 맞는 앱 카드들을 화면에 그려줍니다.
         */
        function renderAppCards() {
            const query = currentSearchQuery.trim().toLowerCase();

            // 조건에 맞는 앱 필터링
            const filteredApps = appList.filter(app => {
                const matchesCategory = (currentCategory === '전체') || (app.category === currentCategory);
                const matchesSearch = app.title.toLowerCase().includes(query) || app.desc.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });

            appGridEl.innerHTML = '';

            // 결과가 없을 경우 안내 화면 표시
            if (filteredApps.length === 0) {
                appGridEl.classList.add('hidden');
                emptyStateEl.classList.remove('hidden');
                return;
            } else {
                appGridEl.classList.remove('hidden');
                emptyStateEl.classList.add('hidden');
            }

            // 각 앱 데이터마다 카드 생성
            filteredApps.forEach(app => {
                const theme = categoryColors[app.category] || categoryColors['default'];

                // 카드 전체를 <a> 태그로 만들어 어디를 눌러도 새 탭으로 열리게 구성
                const cardLink = document.createElement('a');
                cardLink.href = app.url;
                cardLink.target = '_blank';
                cardLink.rel = 'noopener noreferrer';
                cardLink.className = `app-card group flex flex-col justify-between bg-white rounded-3xl p-6 border-2 border-stone-100 ${theme.borderHover} shadow-sm cursor-pointer select-none`;

                cardLink.innerHTML = `
                    <div>
                        <!-- 상단: 귀여운 이모지 아이콘 + 과목 뱃지 -->
                        <div class="flex items-start justify-between gap-3 mb-4">
                            <div class="w-16 h-16 ${theme.iconBg} rounded-2xl flex items-center justify-center text-4xl shadow-inner group-hover:scale-110 transition-transform duration-200">
                                ${app.icon || '📱'}
                            </div>
                            <span class="px-3 py-1 rounded-full text-xs font-bold border ${theme.badge}">
                                ${app.category}
                            </span>
                        </div>

                        <!-- 중단: 앱 제목과 설명 -->
                        <h2 class="font-title text-2xl text-choco mb-2 group-hover:text-pink-accent transition-colors">
                            ${app.title}
                        </h2>
                        <p class="text-stone-600 text-sm sm:text-base leading-relaxed line-clamp-2">
                            ${app.desc}
                        </p>
                    </div>

                    <!-- 하단: 열기 안내 바 -->
                    <div class="mt-5 pt-3 border-t border-stone-100 flex items-center justify-between text-xs sm:text-sm font-bold text-stone-400 group-hover:text-mint-accent transition-colors">
                        <span>클릭해서 시작하기</span>
                        <span class="inline-flex items-center gap-1 bg-stone-50 group-hover:bg-soft-mint group-hover:text-teal-800 px-2.5 py-1 rounded-full transition-colors">
                            열기 ↗
                        </span>
                    </div>
                `;

                appGridEl.appendChild(cardLink);
            });
        }

        // 검색창 입력 이벤트 처리
        searchInputEl.addEventListener('input', (e) => {
            currentSearchQuery = e.target.value;
            if (currentSearchQuery.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
            renderAppCards();
        });

        // 검색어 지우기 버튼 이벤트
        clearSearchBtn.addEventListener('click', () => {
            searchInputEl.value = '';
            currentSearchQuery = '';
            clearSearchBtn.classList.add('hidden');
            searchInputEl.focus();
            renderAppCards();
        });

        // 페이지 로드 시 초기 화면 그리기
        window.addEventListener('DOMContentLoaded', () => {
            renderCategoryButtons();
            renderAppCards();
        });
    </script>
</body>
</html>
